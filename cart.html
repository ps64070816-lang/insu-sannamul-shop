<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>장바구니 - 인수의 산나물 가게</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Malgun Gothic', sans-serif;
  }

  html {
    height: 100%;
  }

  body {
    min-height: 100vh;
    background-color: #1e6091;
    background-image: url('https://images.unsplash.com/photo-1542708993627-b6e5bbae43c4?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #333;
  }

  header {
    background-color: #1e6091;
    color: white;
    text-align: center;
    padding: 20px;
  }

  header h1 {
    font-size: 26px;
  }

  .cart-page-section {
    background-color: white;
    padding: 30px 20px;
    margin: 30px 20px;
    border-radius: 10px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  .cart-empty-text {
    text-align: center;
    color: #999;
    font-size: 14px;
    padding: 20px 0;
  }

  .cart-select-all {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    margin-bottom: 5px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    color: #555;
  }

  .cart-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }

  .cart-row:last-child {
    border-bottom: none;
  }

  .cart-item-name {
    flex: 1;
    font-size: 15px;
    color: #333;
  }

  .cart-item-date {
    font-size: 12px;
    color: #999;
    white-space: nowrap;
  }

  .cart-remove-btn {
    background-color: #e63946;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }

  .cart-remove-btn:hover {
    background-color: #c5313d;
  }

  .cart-total {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px solid #1e6091;
    font-size: 17px;
    font-weight: bold;
    color: #1e6091;
  }

  .back-link {
    display: block;
    text-align: center;
    margin: 25px auto 40px;
    color: white;
    text-decoration: none;
    font-size: 14px;
  }

  .back-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <header>
    <h1>장바구니</h1>
  </header>

  <div class="cart-page-section">
    <div id="cart-page-list">
      <p class="cart-empty-text">담긴 상품이 없습니다</p>
    </div>
    <div class="cart-total">
      <span>선택 상품 합계</span>
      <span id="cart-total-price">0원</span>
    </div>
  </div>

  <a class="back-link" href="index.html">← 쇼핑 계속하기</a>

  <!-- Supabase 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase 클라이언트 (아직 특정 기능에 연결하지 않고, 준비만 해둔 상태)
    const SUPABASE_URL = 'https://jrkofuxuhkigwllirkmk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AjeTffA5iwUFd-xKLEvDPg_o0yuW6_I';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <script>
    const CART_STORAGE_KEY = 'sannamulCart';
    const cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '{}');

    // 선택 여부는 화면에서만 쓰는 상태 (기본은 전체 선택)
    const selected = {};
    Object.keys(cart).forEach(function (name) {
      selected[name] = true;
    });

    function saveCart() {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    }

    function formatDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function removeFromCart(name) {
      if (!cart[name]) return;
      cart[name].qty -= 1;
      if (cart[name].qty <= 0) {
        delete cart[name];
        delete selected[name];
      }
      renderCart();
    }

    function toggleSelect(name, checked) {
      selected[name] = checked;
      renderTotal();
    }

    function toggleSelectAll(checked) {
      Object.keys(cart).forEach(function (name) {
        selected[name] = checked;
      });
      renderCart();
    }

    function renderTotal() {
      let total = 0;
      Object.keys(cart).forEach(function (name) {
        if (selected[name]) {
          total += cart[name].price * cart[name].qty;
        }
      });
      document.getElementById('cart-total-price').textContent = total.toLocaleString() + '원';
    }

    function renderCart() {
      saveCart();

      const names = Object.keys(cart);
      const listEl = document.getElementById('cart-page-list');

      if (names.length === 0) {
        listEl.innerHTML = '<p class="cart-empty-text">담긴 상품이 없습니다</p>';
        document.getElementById('cart-total-price').textContent = '0원';
        return;
      }

      const allChecked = names.every(function (name) { return selected[name]; });

      const selectAllHtml = '<div class="cart-select-all">' +
        '<input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)" ' + (allChecked ? 'checked' : '') + '>' +
        '<label for="select-all">전체 선택</label>' +
        '</div>';

      const rowsHtml = names.map(function (name) {
        const item = cart[name];
        const checked = selected[name] ? 'checked' : '';
        return '<div class="cart-row">' +
          '<input type="checkbox" onchange="toggleSelect(\'' + name + '\', this.checked)" ' + checked + '>' +
          '<span class="cart-item-name">' + name + ' - ' + item.price.toLocaleString() + '원 x ' + item.qty + '</span>' +
          '<span class="cart-item-date">' + formatDate(item.addedAt) + ' 담음</span>' +
          '<button class="cart-remove-btn" onclick="removeFromCart(\'' + name + '\')">빼기</button>' +
          '</div>';
      }).join('');

      listEl.innerHTML = selectAllHtml + rowsHtml;

      renderTotal();
    }

    renderCart();
  </script>

</body>
</html>
