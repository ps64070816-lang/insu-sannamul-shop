<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인수의 산나물 가게</title>
<style>
  /* 전체 기본 설정 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Malgun Gothic', sans-serif;
  }

  html {
    height: 100%;
  }

  body {
    min-height: 100vh;
    background-color: #1e6091;
    background-image: url('https://images.unsplash.com/photo-1542708993627-b6e5bbae43c4?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #333;
  }

  /* 헤더 (쇼핑몰 이름 + 소개) */
  header {
    background-color: #1e6091;
    color: white;
    text-align: center;
    padding: 20px;
  }

  header h1 {
    font-size: 28px;
    margin-bottom: 5px;
  }

  header p {
    font-size: 14px;
  }

  /* 메뉴 */
  nav {
    display: flex;
    justify-content: center;
    background-color: #2a7fb8;
  }

  nav a {
    color: white;
    text-decoration: none;
    padding: 15px 20px;
    font-size: 16px;
  }

  nav a:hover {
    background-color: #1e6091;
  }

  /* 배너 */
  .banner {
    background-color: #cfe8f7;
    text-align: center;
    padding: 60px 20px;
  }

  .banner h2 {
    font-size: 26px;
    margin-bottom: 20px;
    color: #1e6091;
  }

  .banner button {
    background-color: #1e6091;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  .banner button:hover {
    background-color: #14486d;
  }

  /* 카테고리 버튼 */
  .category-buttons {
    text-align: center;
    padding: 30px 20px 0;
  }

  .cat-btn {
    background-color: white;
    color: #1e6091;
    border: 2px solid #1e6091;
    padding: 8px 18px;
    margin: 0 5px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }

  .cat-btn.active {
    background-color: #1e6091;
    color: white;
  }

  /* 상품 목록 */
  .products {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
    flex-wrap: wrap;
  }

  .card {
    position: relative;
    background-color: white;
    border: 1px solid #dceefb;
    border-radius: 10px;
    width: 220px;
    text-align: center;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .best-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    background-color: #ff4757;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .card .product-photo {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .card h3 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #1e6091;
  }

  .card .old-price {
    text-decoration: line-through;
    color: #999;
    font-size: 14px;
  }

  .card .price {
    font-size: 20px;
    font-weight: bold;
    color: #d9534f;
  }

  .card .discount {
    color: red;
    font-size: 15px;
  }

  /* 하단 연락처 */
  footer {
    background-color: #1e6091;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 20px;
    font-size: 14px;
  }

  /* 페이지 안에서 뜨는 팝업 */
  .popup-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .popup-overlay.active {
    display: flex;
  }

  .popup-box {
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 320px;
    text-align: center;
    position: fixed;
    transition: left 0.7s ease, top 0.7s ease;
  }

  .popup-box p {
    white-space: pre-line;
    margin-bottom: 20px;
    color: #333;
  }

  .popup-box button {
    background-color: #1e6091;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <!-- 상단: 쇼핑몰 이름 + 소개 -->
  <header>
    <h1>인수의 산나물 가게</h1>
    <p>산에서 바로 온 신선하고 맛있는 산나물</p>
  </header>

  <!-- 메뉴 4개 -->
  <nav>
    <a href="#" onclick="showStaticPopup('회사소개\n\n인수의 산나물 가게는 신선하고 맛있는 산나물을 산지에서 바로 보내드립니다.')">홈</a>
    <a href="#">전체상품</a>
    <a href="#">베스트</a>
    <a href="#">고객센터</a>
    <a href="#">이벤트</a>
    <a href="#">공지사항</a>
    <a href="#" onclick="showStaticPopup('문의 전화: 010-1234-5678')">문의하기</a>
  </nav>

  <!-- 큰 배너 -->
  <div class="banner">
    <h2>오늘 캔 신선한 산나물, 지금 만나보세요!</h2>
    <button onclick="showStaticPopup('신선한 산나물을 준비했어요! 곧 만나보세요 😊')">상품 보러가기</button>
  </div>

  <!-- 카테고리 버튼 -->
  <div class="category-buttons">
    <button class="cat-btn active" onclick="filterCategory('전체', this)">전체</button>
    <button class="cat-btn" onclick="filterCategory('잎나물', this)">잎나물</button>
    <button class="cat-btn" onclick="filterCategory('뿌리줄기', this)">뿌리줄기</button>
    <button class="cat-btn" onclick="filterCategory('새싹', this)">새싹</button>
  </div>

  <!-- 상품 카드 5개 -->
  <div class="products">

    <div class="card" data-category="뿌리줄기">
      <div class="best-badge">BEST</div>
      <img class="product-photo" src="https://upload.wikimedia.org/wikipedia/commons/7/78/Bracken_%28Pteridium_aquilinum%29_frond_unfurling.JPG" alt="고사리">
      <h3>고사리</h3>
      <div class="old-price">8,000원</div>
      <div class="price">6,500원 <span class="discount"></span></div>
    </div>

    <div class="card" data-category="잎나물">
      <div class="best-badge">BEST</div>
      <img class="product-photo" src="https://images.pexels.com/photos/4506881/pexels-photo-4506881.jpeg?auto=compress&cs=tinysrgb&w=400" alt="취나물">
      <h3>취나물</h3>
      <div class="old-price">7,000원</div>
      <div class="price">5,900원 <span class="discount"></span></div>
    </div>

    <div class="card" data-category="잎나물">
      <div class="best-badge">BEST</div>
      <img class="product-photo" src="https://images.pexels.com/photos/2270249/pexels-photo-2270249.jpeg?auto=compress&cs=tinysrgb&w=400" alt="곰취">
      <h3>곰취</h3>
      <div class="old-price">9,000원</div>
      <div class="price">7,500원 <span class="discount"></span></div>
    </div>

    <div class="card" data-category="새싹">
      <img class="product-photo" src="https://images.pexels.com/photos/36346265/pexels-photo-36346265.jpeg?auto=compress&cs=tinysrgb&w=400" alt="콩나물">
      <h3>콩나물</h3>
      <div class="old-price">3,000원</div>
      <div class="price">2,200원 <span class="discount"></span></div>
    </div>

    <div class="card" data-category="잎나물">
      <img class="product-photo" src="https://upload.wikimedia.org/wikipedia/commons/9/90/Korean_angelica-tree_shoots.jpg" alt="두릅">
      <h3>두릅</h3>
      <div class="old-price">10,000원</div>
      <div class="price">8,500원 <span class="discount"></span></div>
    </div>

  </div>

  <!-- 맨 아래 연락처 -->
  <footer>
    <p>인수의 산나물 | 대표: 인수 | 전화: 010-1234-5678</p>
    <p>주소: 강원도 어느 산골 마을</p>
  </footer>

  <!-- 페이지 안에서 뜨는 팝업 -->
  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <p id="popup-text"></p>
      <button onclick="closePopup()">닫기</button>
    </div>
  </div>

  <script>
    // 화면 가운데에 뜨는 팝업
    function showStaticPopup(message) {
      const box = document.querySelector('.popup-box');
      document.getElementById('popup-text').innerText = message;
      document.getElementById('popup').classList.add('active');

      box.style.left = (window.innerWidth - box.offsetWidth) / 2 + 'px';
      box.style.top = (window.innerHeight - box.offsetHeight) / 2 + 'px';
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }

    // 카테고리 버튼 클릭 시 해당 상품만 보여주기
    function filterCategory(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');

      document.querySelectorAll('.card').forEach(function (card) {
        if (category === '전체' || card.dataset.category === category) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // 할인율 계산해서 가격 옆에 보여주기
    const cards = document.querySelectorAll('.card');
    cards.forEach(function (card) {
      const oldPriceText = card.querySelector('.old-price').textContent;
      const priceText = card.querySelector('.price').textContent;

      const oldPrice = Number(oldPriceText.replace(/[^0-9]/g, ''));
      const price = Number(priceText.replace(/[^0-9]/g, ''));

      const discountRate = Math.round((1 - price / oldPrice) * 100);

      card.querySelector('.discount').textContent = '(' + discountRate + '% 할인)';
    });
  </script>

</body>
</html>
